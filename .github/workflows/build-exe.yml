# The public repo's .github/workflows/build-exe.yml (copied there by docs/tools/make_public_repo.py).
# Builds the patcher as a Windows .exe (no Python needed) on GitHub's Windows machine, from the code
# in the repo, and attaches it to the release:
# - when a release is published;
# - or by hand (Actions > Build the Windows patcher > Run workflow), with the tag of a release, even a
#   draft, to attach it to; with no tag it is only kept as the run's artifact.
name: Build the Windows patcher

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .exe to (empty = only build it)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.3
      - name: Build BL3_English_Patcher.exe
        run: >
          pyinstaller --onefile --windowed --noconfirm --name BL3_English_Patcher
          --icon patch/images/patcher.ico
          --add-data "patch/fonts;fonts" --add-data "patch/sounds;sounds" --add-data "patch/images;images"
          patch/BL3_Patcher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: BL3_English_Patcher
          path: dist/BL3_English_Patcher.exe
      - name: Attach it to the release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$env:TAG" dist/BL3_English_Patcher.exe --clobber --repo "$env:GITHUB_REPOSITORY"
